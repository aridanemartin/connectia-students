components:
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      description: Identificador UUID de un documento individual.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: La solicitud contiene datos no válidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: El identificador es válido, pero el recurso no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Error inesperado, serializado sin detalles internos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # --- Modelo completo: úsalo como referencia para los demás ----------------
    QuestionRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: \S

    # --- TODO: completa estas formas -----------------------------------------
    # Pista: mira lo que responde tu API de verdad (curl o Bruno).
    QuestionResponse:
      type: object
      required: [answer, citations]
      properties:
        answer:
          type: string
        # TODO: añade `citations` como array de Citation.

    Citation:
      type: object
      additionalProperties: false
      required: [documentId, title, excerpt]
      properties:
        # TODO: documentId es UUID; title y excerpt son texto.
        {}

    QuestionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/QuestionResponse'

    AdministrativeDocument:
      type: object
      required: [id, title, description, createdAt]
      properties:
        # TODO: decide tipos y límites. Pistas:
        #   id -> string con format uuid, readOnly
        #   createdAt -> string con format date-time, readOnly
        #   title -> minLength/maxLength
        #   description -> maxLength
        {}

    DocumentEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AdministrativeDocument'

    CreateDocumentRequest:
      type: object
      additionalProperties: false
      # TODO: ¿qué campo es obligatorio? Míralo en tu controlador de crear.
      required: []
      properties:
        {}

    UpdateDocumentRequest:
      type: object
      additionalProperties: false
      # TODO: PATCH exige al menos un campo -> minProperties: 1
      properties:
        {}

    Pagination:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0

    DocumentListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdministrativeDocument'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # --- Envoltorio de error: ya está completo, revísalo -----------------------
    # Es la forma { error, message } que ya responde vuestro errorHandler del
    # Topic 05. `issues` solo aparece en los errores de validación, que vuestro
    # backend empezará a devolver en el Topic 07.
    ValidationIssue:
      type: object
      required: [location, path, message]
      properties:
        location:
          type: string
          enum: [body, params, query]
        path:
          type: array
          description: Ruta del campo que falla, por ejemplo ["title"].
          items:
            type: [string, integer]
        message:
          type: string

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          enum:
            - VALIDATION_ERROR
            - INVALID_JSON
            - NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
